<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>Space Panic - Browser Clone</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #121212;
      --accent: #00c2ff;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, #1a1a1a, #050505 60%, #000);
      color: #e5e5e5;
      font-family: "Press Start 2P", "MS Gothic", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      margin: 6px 0 0;
      letter-spacing: 2px;
      color: var(--accent);
    }

    canvas {
      border: 4px solid #2b2b2b;
      background: #000;
      image-rendering: pixelated;
      box-shadow: 0 0 20px rgba(0, 194, 255, 0.15);
      max-width: 100%;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #bfbfbf;
    }

    .inst {
      font-size: 10px;
      color: #9b9b9b;
      width: min(100%, 640px);
    }
  </style>
</head>

      const cssWidth = Math.floor(LOGICAL_WIDTH * scale);
      const cssHeight = Math.floor(LOGICAL_HEIGHT * scale);
      const dpr = window.devicePixelRatio || 1;

      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;
      canvas.width = Math.max(1, Math.floor(cssWidth * dpr));
      canvas.height = Math.max(1, Math.floor(cssHeight * dpr));

    // 同じスプライトの横幅を毎回走査しないように保持する。
    const spriteWidths = new WeakMap();

    function getSpriteWidth(sprite) {
      let width = spriteWidths.get(sprite);
      if (width === undefined) {
        width = sprite.reduce((max, cell) => Math.max(max, cell.x), 0) + 1;
        spriteWidths.set(sprite, width);
      }
      return width;
    }

    // ピクセル定義されたスプライトを指定位置に描画する。
    function drawSprite(sprite, x, y, flipX = false) {
      const spriteWidth = getSpriteWidth(sprite);
      for (const cell of sprite) {
        const dx = flipX ? spriteWidth - 1 - cell.x : cell.x;
        ctx.fillStyle = COLORS[cell.colorCode];
        ctx.fillRect(x + dx, y + cell.y, 1, 1);
      }
    }

    // 梯子を配置するチップ列をランダムに選ぶ。
    function randomLadderChipColumn() {
      const x = Math.floor(Math.random() * 7) * 16 + 16;
      return Math.floor(x / CHIP_W);
    }

    const KEYS = new Set();
    const CONTROL_KEYS = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "];
    let lastHudText = "";

    window.addEventListener("keydown", (e) => {
      KEYS.add(e.key);
      if (CONTROL_KEYS.includes(e.key)) e.preventDefault();
      if (!e.repeat && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key) && state.player) {
        if (state.player.blockedMoveKey === e.key) state.player.blockedMoveKey = null;
        state.player.moveCommand = e.key;
      }
      if (e.key === "Enter" && state.mode === "TITLE") startGame();
    });
    window.addEventListener("keyup", (e) => {
      KEYS.delete(e.key);
      if (state.player && state.player.blockedMoveKey === e.key) {
        state.player.blockedMoveKey = null;
      }
    });

    // 床と梯子を配置したステージマップを生成する。
    function makeStageMap() {
      const map = Array.from({ length: ROWS }, () => Array(COLS).fill(MAP_EMPTY));

      FLOOR_ROWS.forEach((row) => {
        for (let floorRow = row; floorRow < row + TILE_H / CHIP_H; floorRow++) {
          for (let col = 0; col < COLS; col++) {
            map[floorRow][col] = MAP_FLOOR;
          }
        }
      });

      LADDER_GROUPS.forEach((group) => {
        const usedCols = new Set();
        while (usedCols.size < group.count) {
          usedCols.add(randomLadderChipColumn());
        }
        usedCols.forEach((col) => {
          const ladderTopRow = Math.max(group.startRow - 1, 0) * TILE_H / CHIP_H;
          const ladderEndRow = group.endRow * TILE_H / CHIP_H + TILE_H / CHIP_H - 1;
          for (let row = ladderTopRow; row <= ladderEndRow; row++) {
            for (let ladderCol = col; ladderCol < col + TILE_W / CHIP_W; ladderCol++) {
              if (inMapBounds(ladderCol, row)) map[row][ladderCol] = MAP_LADDER;
            }
          }
        });
      });

      return map;
    }

    const state = {
      mode: "TITLE",
      score: 0,
      lives: 3,
      stage: 1,
      map: makeStageMap(),
      holes: [],

      lastTime: 0,
    };

    // 指定したマップ座標がステージ範囲内か判定する。
    function inMapBounds(col, row) {
      return col >= 0 && col < COLS && row >= 0 && row < ROWS;
    }

    // プレイヤー用の移動可能方向フラグを初期化する。
    function createMoveFlags() {
      return {
        left: false,
        right: false,
        up: false,
        down: false,
      };
    }

    // プレイヤーの初期データを作成する。
    function createPlayer() {
      return {
        x: TILE_W,
        y: 84,
        w: 8,
        h: 12,
        vx: 0,
        vy: 0,
        facing: 1,
        onLadder: false,
        supportLockRow: null,
        digging: 0,
        anim: 0,
        climbAnim: 0,
        moveRemainderX: 0,
        moveRemainderY: 0,
        moveCommand: null,
        moveDistanceRemaining: 0,
        blockedMoveKey: null,
        ladderEntryFloorRow: null,
        moveFlags: createMoveFlags(),
      };
    }

    // 敵キャラクターの初期データを作成する。
    function createEnemy(x, y) {
      return {
        x,
        y,
        w: 8,
        h: 8,
        vx: 0,
        vy: 0,
        state: "walk",
        trappedTimer: 0,
        anim: 0,
        onLadder: false,
        supportLockRow: null,
        moveFlags: createMoveFlags(),
        moveRemainderX: 0,
        moveRemainderY: 0,
        moveDistanceRemaining: 0,
        ladderEntryFloorRow: null,
      };
    }

    // マップ、穴、プレイヤー、敵をまとめてステージ開始状態に戻す。
    function resetStage(stage) {
      state.stage = stage;
      state.map = makeStageMap();
      state.holes = [];
      resetPlayer();
      spawnEnemies();
      state.mode = "PLAY";
    }

    // プレイヤーの位置や移動状態を初期状態に戻す。
    function resetPlayer() {
      state.player = createPlayer();
    }

    // 現在のステージに出現する敵キャラクターを生成する。
    function spawnEnemies() {
      const base = [
        { x: 64, y: 8 },
        { x: 72, y: 28 },
        { x: 96, y: 48 },
      ];
      state.enemies = base.map((p) => createEnemy(p.x, p.y));
    }

    // スコアや残機を初期化して新しいゲームを開始する。
    function startGame() {
      state.score = 0;
      state.lives = 3;
      resetStage(1);
    }

    // ステージ番号を進め、新しいマップと敵配置で再開する。
    function nextStage() {
      resetStage(state.stage + 1);
    }

    // プレイヤーの残機を減らし、ゲームオーバーまたは復帰処理を行う。
    function loseLife() {
      state.lives -= 1;
      if (state.lives <= 0) {
        state.mode = "TITLE";
        state.player = null;
        state.enemies = [];
        state.holes = [];
      } else {
        resetPlayer();
      }
    }

    // 指定したマップ座標にあるチップ種別を取得する。
    function mapValueAt(col, row) {
      if (!inMapBounds(col, row)) return MAP_EMPTY;
      return state.map[row][col];
    }

    // 指定したマップ座標に掘られた穴があるか探す。
    function holeAt(col, row) {
      return state.holes.find((h) =>
        col >= h.col
        && col < h.col + h.width
        && row >= h.row
        && row < h.row + h.height
      );
    }

    // 指定したマップ座標が床チップかどうかを判定する。
    function hasFloorAtCell(col, row) {
      const chip = mapValueAt(col, row);
      const onFloorRow = FLOOR_ROWS.some(
        (floorRow) => row >= floorRow && row < floorRow + TILE_H / CHIP_H
      );
      return chip === MAP_FLOOR || (chip === MAP_LADDER && onFloorRow);
    }

    // 指定したマップ座標が梯子チップかどうかを判定する。
    function hasLadderAtCell(col, row) {
      return mapValueAt(col, row) === MAP_LADDER;
    }

    // 穴の状態により、その床が通行・着地できない状態か判定する。
    function floorBlockedByHole(col, row) {
      const hole = holeAt(col, row);
      if (!hole) return false;
      if (hole.phase === "open") return true;
      if (hole.phase === "closing" && hole.timer >= 0.2) return true;
      return false;
    }

    // 座標が指定グリッド幅にほぼ揃っているか判定する。
    function isAlignedToGrid(value, size) {
      return Math.abs(value - Math.round(value / size) * size) < 0.001;
    }

    // 座標を最も近いグリッド位置に丸める。
    function snapToGrid(value, size) {
      return Math.round(value / size) * size;
    }

    // エンティティの現在位置からマップ列を求める。
    function entityColumn(entity) {
      return Math.round(entity.x / CHIP_W);
    }

    // エンティティ上端が属するマップ行を求める。
    function entityTopRow(entity) {
      return Math.floor(entity.y / CHIP_H);
    }

    // エンティティ下端が属するマップ行を求める。
    function entityBottomRow(entity) {
      return Math.floor((entity.y + entity.h - 1) / CHIP_H);
    }

    // エンティティの足元が乗る支え行を求める。
    function entitySupportRow(entity) {
      return Math.floor((entity.y + entity.h) / CHIP_H);
    }

    // エンティティの足元がまたぐマップ列を求める。
    function entityFootColumns(entity) {
      const leftCol = Math.floor((entity.x + 1) / CHIP_W);
      const rightCol = Math.floor((entity.x + entity.w - 2) / CHIP_W);
      return leftCol === rightCol ? [leftCol] : [leftCol, rightCol];
    }

    // エンティティが現在の列で梯子に触れているか判定する。
    function entityTouchesLadder(entity) {
      if (!ladderAligned(entity)) return false;
      const col = entityColumn(entity);
      const topRow = entityTopRow(entity);
      const bottomRow = entityBottomRow(entity);
      for (let row = topRow; row <= bottomRow; row++) {
        if (hasLadderAtCell(col, row)) return true;
      }
      return false;
    }

    // エンティティの上方向に登れる梯子があるか判定する。
    function ladderAboveEntity(entity) {
      if (!ladderAligned(entity)) return false;
      return hasLadderAtCell(entityColumn(entity), entityTopRow(entity) - 1);
    }

    // エンティティの下方向に降りられる梯子があるか判定する。
    function ladderBelowEntity(entity) {
      if (!ladderAligned(entity)) return false;
      return hasLadderAtCell(entityColumn(entity), entitySupportRow(entity));
    }

    // エンティティの左端が梯子の横幅に揃っているか判定する。
    function ladderAligned(entity) {
      return isAlignedToGrid(entity.x, TILE_W);
    }

    // エンティティの縦位置がチップ境界に揃っているか判定する。
    function verticalAligned(entity) {
      return isAlignedToGrid(entity.y, CHIP_H);
    }

    // 移動方向を切り替えられるグリッド交点にいるか判定する。
    function atDecisionPoint(entity) {
      return isAlignedToGrid(entity.x, CHIP_W) && verticalAligned(entity);
    }

    // 指定したマップ行にエンティティの足元を支える床セルがあるか判定する。
    function supportRowHasFloor(entity, row) {
      if (!FLOOR_ROWS.includes(row)) return false;
      return entityFootColumns(entity).some((col) => canStandOnCell(col, row));
    }

    // エンティティの足元近くにある支え行をマップから探す。
    function findSupportRow(entity, maxDistance = 3) {
      const startRow = entitySupportRow(entity);
      const footY = entity.y + entity.h;
      for (let offset = 0; ; offset++) {
        const row = startRow + offset;
        const distance = row * CHIP_H - footY;
        if (distance > maxDistance) break;
        if (supportRowHasFloor(entity, row)) return row;
      }
      return null;
    }

    // エンティティの足元が床に支えられているか判定する。
    function feetOnFloor(entity) {
      return findSupportRow(entity) !== null;
    }

    // エンティティの現在の支え行に床セルがあるか判定する。
    function footOnFloorMap(entity) {
      return supportRowHasFloor(entity, entitySupportRow(entity));
    }

    // エンティティを直下の床にぴったり乗る位置へ補正する。
    function snapToFloor(entity) {
      const supportRow = findSupportRow(entity);
      if (supportRow === null) return;
      entity.y = supportRow * CHIP_H - entity.h;
      entity.vy = 0;
    }

    // 指定セルが穴で塞がれていない、立てる床か判定する。
    function canStandOnCell(col, row) {
      return hasFloorAtCell(col, row) && !floorBlockedByHole(col, row);
    }

    // 横移動先のセルへ進入できるか判定する。
    function canMoveHorizontallyIntoCell(col, row) {
      if (!inMapBounds(col, row)) return false;
      if (canStandOnCell(col, row)) return true;
      return hasLadderAtCell(col, row);
    }

    // エンティティが指定した支え行に留まれるか判定する。
    function canStayOnSupportRow(entity, row) {
      const col = entityColumn(entity);
      if (!inMapBounds(col, row)) return false;
      return canStandOnCell(col, row) || hasLadderAtCell(col, row);
    }

    // 現在位置からエンティティが進める方向フラグを更新する。
    function refreshMoveFlags(entity) {
      if (!atDecisionPoint(entity)) return;

      const col = entityColumn(entity);
      const supportRow = entitySupportRow(entity);
      const ladderAbove = ladderAboveEntity(entity);
      const ladderBelow = ladderBelowEntity(entity);
      const onLadder = entity.onLadder && entityTouchesLadder(entity);
      const standing = canStandOnCell(col, supportRow);
      const supportLocked = entity.supportLockRow === supportRow;
      const canStepSideways = standing || supportLocked;

      entity.moveFlags.left = col > 0 && canStepSideways && canMoveHorizontallyIntoCell(col - 1, supportRow);
      entity.moveFlags.right = col < COLS - 1 && canStepSideways && canMoveHorizontallyIntoCell(col + 1, supportRow);
      entity.moveFlags.up = ladderAbove || onLadder;
      entity.moveFlags.down = ladderBelow || onLadder;
    }

    // フレームごとの移動量を蓄積し、論理マップのセル単位で座標を更新する。
    function moveEntityInUnits(entity, axis, delta) {
      const remainderKey = axis === "x" ? "moveRemainderX" : "moveRemainderY";
      const totalDelta = entity[remainderKey] + delta;
      const requestedSteps = Math.trunc(totalDelta / MOVE_UNIT);
      const maxSteps = entity.moveDistanceRemaining > 0
        ? Math.floor(entity.moveDistanceRemaining / MOVE_UNIT)
        : Infinity;
      const steps = Math.sign(requestedSteps) * Math.min(Math.abs(requestedSteps), maxSteps);
      entity[remainderKey] = totalDelta - steps * MOVE_UNIT;

      if (steps === 0) return;

      const unitDelta = Math.sign(steps) * MOVE_UNIT;
      for (let i = 0; i < Math.abs(steps); i++) {
        entity[axis] += unitDelta;
      }

      if (entity.moveDistanceRemaining > 0) {
        entity.moveDistanceRemaining -= Math.abs(steps) * MOVE_UNIT;
        if (entity.moveDistanceRemaining <= 0) {
          entity.moveDistanceRemaining = 0;
          entity.moveRemainderX = 0;
          entity.moveRemainderY = 0;
          entity.vx = 0;
          entity.vy = 0;
        }
      }
    }

    // プレイヤーの向いている方向の床に穴を掘る。
    function digHole() {
      const p = state.player;
      if (!p) return;
      if (p.digging > 0) return;
      const dir = p.facing;
      const col = entityColumn(p) + p.w / CHIP_W * (dir > 0 ? 1 : -1);
      const row = entitySupportRow(p);
      if (!hasFloorAtCell(col, row)) return;
      if (holeAt(col, row)) return;

      p.digging = CONFIG.digDuration;
      state.holes.push({
        col,
        row,
        width: TILE_W / CHIP_W,
        height: TILE_H / CHIP_H,
        timer: CONFIG.holeOpenTime,
        phase: "open",
      });
    }

    // 穴の開閉タイマーを進め、閉じ終わった穴を削除する。
    function updateHoles(dt) {
      for (let i = state.holes.length - 1; i >= 0; i--) {
        const h = state.holes[i];
        if (h.phase === "open") {
          h.timer -= dt;
          if (h.timer <= 0) {
            h.phase = "closing";
            h.timer = CONFIG.holeCloseTime;
          }
        } else if (h.phase === "closing") {
          h.timer -= dt;
        }
        if (h.phase === "closing" && h.timer <= 0) state.holes.splice(i, 1);
      }
    }

    // エンティティが画面外に出ないよう座標を制限する。
    function keepInBounds(entity) {
      entity.x = Math.max(0, Math.min(entity.x, LOGICAL_WIDTH - entity.w));
      entity.y = Math.max(0, Math.min(entity.y, LOGICAL_HEIGHT - entity.h));
    }

    // エンティティを指定した支え行に固定し、落下速度を止める。
    function lockToSupportRow(entity, row) {
      entity.supportLockRow = row;
      entity.y = row * CHIP_H - entity.h;
      entity.vy = 0;
    }

    // 1 回分の方向入力を開始する。進行中の通路では、直前の移動可否フラグを使う。
    function startPlayerMove(player, direction) {
      if (!direction || player.digging > 0) return false;

      player.vx = 0;
      player.vy = 0;

      if (direction === "ArrowUp" && player.moveFlags.up) {
        player.onLadder = true;
        player.supportLockRow = null;
        player.ladderEntryFloorRow = null;
        player.vy = -CONFIG.climbSpeed;
      } else if (direction === "ArrowDown" && player.moveFlags.down) {
        const supportRow = entitySupportRow(player);
        player.ladderEntryFloorRow = player.supportLockRow === supportRow
          && supportRowHasFloor(player, supportRow)
          ? supportRow
          : null;
        player.onLadder = true;
        player.supportLockRow = null;
        player.vy = CONFIG.climbSpeed;
      } else if (direction === "ArrowLeft" && player.moveFlags.left) {
        player.onLadder = false;
        lockToSupportRow(player, entitySupportRow(player));
        player.vx = -CONFIG.moveSpeed;
      } else if (direction === "ArrowRight" && player.moveFlags.right) {
        player.onLadder = false;
        lockToSupportRow(player, entitySupportRow(player));
        player.vx = CONFIG.moveSpeed;
      } else {
        return false;
      }

      player.moveDistanceRemaining = player.vx !== 0 ? CHIP_W : CHIP_H;
      return true;
    }

    // プレイヤーが床に乗れる状態なら、床位置と支え行を更新する。
    function settlePlayerOnFloor(player) {
      if (player.onLadder || player.vy < 0 || !verticalAligned(player)) return false;
      const supportRow = entitySupportRow(player);
      if (!supportRowHasFloor(player, supportRow)) return false;
      player.supportLockRow = supportRow;
      player.vy = 0;
      return true;
    }

    // 下向きに1ドット進むとき、通過する床面があれば着地行を返す。
    function landingSupportRow(player, nextY) {
      const currentFootY = player.y + player.h;
      const nextFootY = nextY + player.h;
      const firstRow = Math.ceil(currentFootY / CHIP_H);
      const lastRow = Math.floor(nextFootY / CHIP_H);
      for (let row = firstRow; row <= lastRow; row++) {
        if (supportRowHasFloor(player, row)) return row;
      }
      return null;
    }

    // 梯子を上る途中で床面に到達した場合、その支え行を返す。
    function ascendingLandingSupportRow(entity, previousY, nextY) {
      const currentFootY = previousY + entity.h;
      const nextFootY = nextY + entity.h;
      const firstRow = Math.ceil(nextFootY / CHIP_H);
      const lastRow = Math.floor((currentFootY - 0.001) / CHIP_H);
      for (let row = firstRow; row <= lastRow; row++) {
        if (supportRowHasFloor(entity, row)) return row;
      }
      return null;
    }

    // 下向きの梯子移動で床面に到達した場合、その支え行を返す。
    function descendingLandingSupportRow(entity, previousY, nextY, passThroughFloorRow) {
      const currentFootY = previousY + entity.h;
      const nextFootY = nextY + entity.h;
      const firstRow = Math.ceil((currentFootY + 0.001) / CHIP_H);
      const lastRow = Math.floor(nextFootY / CHIP_H);
      for (let row = firstRow; row <= lastRow; row++) {
        const leavingStartingFloor = passThroughFloorRow !== null
          && row >= passThroughFloorRow
          && row < passThroughFloorRow + TILE_H / CHIP_H;
        if (!leavingStartingFloor && supportRowHasFloor(entity, row)) return row;
      }
      return null;
    }

    // 梯子移動中に床面を越えたら、床上で止めて次の入力を待つ。
    function settleAfterAscending(entity, previousY, wasClimbing) {
      if (!wasClimbing || entity.y >= previousY) return false;
      const supportRow = ascendingLandingSupportRow(entity, previousY, entity.y);
      if (supportRow === null) return false;

      entity.y = supportRow * CHIP_H - entity.h;
      entity.onLadder = false;
      entity.supportLockRow = supportRow;
      entity.moveDistanceRemaining = 0;
      entity.moveRemainderX = 0;
      entity.moveRemainderY = 0;
      entity.vx = 0;
      entity.vy = 0;
      entity.ladderEntryFloorRow = null;
      entity.blockedMoveKey = "ArrowUp";
      return true;
    }

    // 下向き移動中に開始位置の床を抜けたら、その床だけ通過対象から外す。
    function clearPassedLadderEntryFloor(entity) {
      if (entity.ladderEntryFloorRow === null) return;
      const floorBottom = (entity.ladderEntryFloorRow + TILE_H / CHIP_H) * CHIP_H;
      if (entity.y + entity.h > floorBottom) entity.ladderEntryFloorRow = null;
    }

    // 梯子を下りて次の床に着いたら、押しっぱなし入力を止めて床上に固定する。
    function settleAfterDescending(entity, previousY, wasDescending) {
      if (!wasDescending || entity.y <= previousY) return false;
      const supportRow = descendingLandingSupportRow(
        entity,
        previousY,
        entity.y,
        entity.ladderEntryFloorRow
      );
      if (supportRow === null) {
        clearPassedLadderEntryFloor(entity);
        return false;
      }

      entity.y = supportRow * CHIP_H - entity.h;
      entity.onLadder = false;
      entity.supportLockRow = supportRow;
      entity.moveDistanceRemaining = 0;
      entity.moveRemainderX = 0;
      entity.moveRemainderY = 0;
      entity.vx = 0;
      entity.vy = 0;
      entity.ladderEntryFloorRow = null;
      entity.blockedMoveKey = "ArrowDown";
      return true;
    }

    // 敵が床に乗れる状態なら、床位置と支え行を更新する。
    function settleEnemyOnFloor(enemy) {
      if (enemy.onLadder || enemy.vy < 0 || !feetOnFloor(enemy)) return false;
      snapToFloor(enemy);
      enemy.supportLockRow = entitySupportRow(enemy);
      return true;
    }

    // 梯子移動や通常移動に応じてプレイヤーのアニメーション値を更新する。
    function updatePlayerAnimation(player, dt) {
      if (player.onLadder && Math.abs(player.vy) > 1) {
        player.climbAnim += dt * 8;
      }

      if (Math.abs(player.vx) > 1 && !player.onLadder) {
        player.anim += dt * 8;
      }
    }

    function getPlayerAnimationFrameIndex(animation) {
      const frameSequence = [0, 1, 0, 2];
      return frameSequence[Math.floor(animation) % frameSequence.length];
    }

    // 敵が移動している間だけモンスタースプライトの歩行フレームを進める。
    function updateEnemyAnimation(enemy, dt) {
      if (enemy.state === "walk" && (Math.abs(enemy.vx) > 1 || Math.abs(enemy.vy) > 1)) {
        enemy.anim += dt * 8;
      } else {
        enemy.anim = 0;
      }
    }

    // 梯子上では上下入力を優先し、梯子に入れない場合は左右入力を使う。
    function getPlayerMoveCommand(player) {
      const verticalKeys = ["ArrowUp", "ArrowDown"].filter((key) => KEYS.has(key));
      const horizontalKeys = ["ArrowLeft", "ArrowRight"].filter((key) => KEYS.has(key));
      const preferredKey = (keys) => {
        const latestKey = keys.includes(player.moveCommand) ? player.moveCommand : null;
        return [latestKey, ...keys.filter((key) => key !== latestKey)]
          .find((key) => key && key !== player.blockedMoveKey);
      };
      const availableLadderKeys = verticalKeys.filter((key) =>
        player.moveFlags[key === "ArrowUp" ? "up" : "down"]
        && key !== player.blockedMoveKey
      );

      return availableLadderKeys.length > 0
        ? preferredKey(availableLadderKeys)
        : preferredKey(horizontalKeys) || preferredKey(verticalKeys);
    }

    // 入力、重力、梯子移動、アニメーションを反映してプレイヤーを更新する。
    function updatePlayer(dt) {
      const p = state.player;
      if (!p) return;

      if (p.digging > 0) {
        p.digging -= dt;
        if (p.digging < 0) p.digging = 0;
      }

      const command = p.moveDistanceRemaining === 0 ? getPlayerMoveCommand(p) : null;
      if (atDecisionPoint(p) && p.moveDistanceRemaining === 0) p.moveCommand = null;

      if (command === "ArrowLeft") p.facing = -1;
      if (command === "ArrowRight") p.facing = 1;

      settlePlayerOnFloor(p);

      if (atDecisionPoint(p)) {
        refreshMoveFlags(p);

        if (p.moveDistanceRemaining === 0) {
          p.vx = 0;
          p.vy = 0;

          if (p.digging === 0) {
            if (startPlayerMove(p, command)) {
              // 移動開始時の設定は startPlayerMove で完了している。
            } else {
              const ladderStillUsable = entityTouchesLadder(p) || ladderAboveEntity(p) || ladderBelowEntity(p);
              p.onLadder = p.onLadder && ladderStillUsable;
              if (!p.onLadder && feetOnFloor(p)) {
                p.supportLockRow = entitySupportRow(p);
              }
            }
          } else {
            p.onLadder = false;
            p.supportLockRow = null;
          }
        }
      }

      if (p.onLadder) {
        p.supportLockRow = null;
      } else if (p.supportLockRow !== null) {
        p.vy = 0;
      } else if (feetOnFloor(p)) {
        if (!settlePlayerOnFloor(p)) p.vy += CONFIG.gravity * dt;
      } else {
        p.vx = 0;
        p.vy += CONFIG.gravity * dt;
      }

      moveEntityInUnits(p, "x", p.vx * dt);
      if (p.vy > 0 && !p.onLadder && p.supportLockRow === null) {
        const totalDelta = p.moveRemainderY + p.vy * dt;
        const steps = Math.trunc(totalDelta / MOVE_UNIT);
        p.moveRemainderY = totalDelta - steps * MOVE_UNIT;
        for (let i = 0; i < steps; i++) {
          const nextY = p.y + MOVE_UNIT;
          const landingRow = landingSupportRow(p, nextY);
          if (landingRow !== null) {
            p.y = landingRow * CHIP_H - p.h;
            p.supportLockRow = landingRow;
            p.vy = 0;
            p.moveRemainderY = 0;
            break;
          }
          p.y = nextY;
        }
      } else {
        const previousY = p.y;
        const wasClimbing = p.onLadder && p.vy < 0;
        const wasDescending = p.onLadder && p.vy > 0;
        moveEntityInUnits(p, "y", p.vy * dt);
        settleAfterAscending(p, previousY, wasClimbing);
        if (p.onLadder) settleAfterDescending(p, previousY, wasDescending);
      }

      settlePlayerOnFloor(p);

      if (atDecisionPoint(p)) {
        const ladderStillUsable = entityTouchesLadder(p) || ladderAboveEntity(p) || ladderBelowEntity(p);
        if (p.onLadder && !ladderStillUsable) {
          p.onLadder = false;
          p.vy = 0;
        }
        if (!p.onLadder) {
          if (footOnFloorMap(p)) {
            p.supportLockRow = entitySupportRow(p);
          } else if (p.supportLockRow !== null && canStayOnSupportRow(p, p.supportLockRow)) {
            p.vy = 0;
          } else {
            p.supportLockRow = null;
          }
        }
        refreshMoveFlags(p);
      }

      updatePlayerAnimation(p, dt);
      keepInBounds(p);
    }

    // 論理マップで進める方向だけを候補にして、敵の移動方向をランダムに選ぶ。
    function chooseRandomEnemyMove(enemy) {
      const choices = [];
      if (enemy.moveFlags.left) choices.push("left");
      if (enemy.moveFlags.right) choices.push("right");
      if (enemy.moveFlags.up) choices.push("up");
      if (enemy.moveFlags.down) choices.push("down");

      if (choices.length === 0) {
        enemy.vx = 0;
        enemy.vy = 0;
        enemy.moveDistanceRemaining = 0;
        enemy.moveRemainderX = 0;
        enemy.moveRemainderY = 0;
        return;
      }

      const choice = choices[Math.floor(Math.random() * choices.length)];
      enemy.vx = 0;
      enemy.vy = 0;

      if (choice === "left") {
        enemy.onLadder = false;
        lockToSupportRow(enemy, entitySupportRow(enemy));
        enemy.vx = -CONFIG.enemySpeed;
      } else if (choice === "right") {
        enemy.onLadder = false;
        lockToSupportRow(enemy, entitySupportRow(enemy));
        enemy.vx = CONFIG.enemySpeed;
      } else if (choice === "up") {
        enemy.onLadder = true;
        enemy.supportLockRow = null;
        enemy.ladderEntryFloorRow = null;
        enemy.vy = -CONFIG.climbSpeed * 0.85;
      } else if (choice === "down") {
        const supportRow = entitySupportRow(enemy);
        enemy.ladderEntryFloorRow = enemy.supportLockRow === supportRow
          && supportRowHasFloor(enemy, supportRow)
          ? supportRow
          : null;
        enemy.onLadder = true;
        enemy.supportLockRow = null;
        enemy.vy = CONFIG.climbSpeed * 0.85;
      }
      enemy.moveDistanceRemaining = TILE_W;
    }

    // 敵の移動、落下、穴への捕獲状態を更新する。
    function updateEnemy(enemy, dt) {
      if (enemy.state === "trapped") {
        enemy.trappedTimer -= dt;
        enemy.vx = 0;
        enemy.vy = 0;
        if (enemy.trappedTimer <= 0) {
          enemy.state = "walk";
        }
        return;
      }

      settleEnemyOnFloor(enemy);

      if (atDecisionPoint(enemy) && enemy.moveDistanceRemaining === 0) {
        enemy.x = snapToGrid(enemy.x, CHIP_W);
        enemy.y = snapToGrid(enemy.y, CHIP_H);
        refreshMoveFlags(enemy);
        chooseRandomEnemyMove(enemy);
      }

      if (enemy.onLadder) {
        enemy.x = snapToGrid(enemy.x, CHIP_W);
        enemy.supportLockRow = null;
      } else if (enemy.supportLockRow !== null) {
        enemy.y = enemy.supportLockRow * CHIP_H - enemy.h;
        enemy.vy = 0;
      } else if (feetOnFloor(enemy)) {
        snapToFloor(enemy);
        enemy.supportLockRow = entitySupportRow(enemy);
        enemy.vy = 0;
      } else {
        enemy.vx = 0;
        enemy.moveDistanceRemaining = 0;
        enemy.vy += CONFIG.gravity * dt;
      }

      moveEntityInUnits(enemy, "x", enemy.vx * dt);
      const previousY = enemy.y;
      const wasClimbing = enemy.onLadder && enemy.vy < 0;
      const wasDescending = enemy.onLadder && enemy.vy > 0;
      moveEntityInUnits(enemy, "y", enemy.vy * dt);
      settleAfterAscending(enemy, previousY, wasClimbing);
      if (enemy.onLadder) settleAfterDescending(enemy, previousY, wasDescending);

      if (!enemy.onLadder && enemy.vy >= 0 && feetOnFloor(enemy)) {
        snapToFloor(enemy);
        enemy.supportLockRow = entitySupportRow(enemy);
      }

      if (atDecisionPoint(enemy)) {
        enemy.x = snapToGrid(enemy.x, CHIP_W);
        enemy.y = snapToGrid(enemy.y, CHIP_H);
        const ladderStillUsable = entityTouchesLadder(enemy) || ladderAboveEntity(enemy) || ladderBelowEntity(enemy);
        if (enemy.onLadder && !ladderStillUsable) {
          enemy.onLadder = false;
          enemy.vy = 0;
        }
        if (!enemy.onLadder) {
          if (footOnFloorMap(enemy)) {
            enemy.supportLockRow = entitySupportRow(enemy);
          } else if (enemy.supportLockRow !== null && canStayOnSupportRow(enemy, enemy.supportLockRow)) {
            enemy.y = enemy.supportLockRow * CHIP_H - enemy.h;
            enemy.vy = 0;
          } else {
            enemy.supportLockRow = null;
          }
        }
        refreshMoveFlags(enemy);
      }

      const footRow = entitySupportRow(enemy);
      const footCol = Math.floor((enemy.x + enemy.w / 2) / CHIP_W);
      const hole = holeAt(footCol, footRow);
      if (hole && hole.phase === "open" && enemy.vy >= 0) {
        enemy.state = "trapped";
        enemy.trappedTimer = CONFIG.enemyTrapTime;
        enemy.onLadder = false;
        enemy.supportLockRow = null;
        enemy.y = footRow * CHIP_H - enemy.h + 1;
        enemy.vx = 0;
        enemy.vy = 0;
        enemy.moveDistanceRemaining = 0;
        enemy.moveRemainderX = 0;
        enemy.moveRemainderY = 0;
      }

      updateEnemyAnimation(enemy, dt);
      keepInBounds(enemy);
    }

    // 下入力で穴に捕まった敵を踏みつけ、スコア加算と敵削除を行う。
    function resolveStomp() {
      const p = state.player;
      if (!p) return;
      if (!KEYS.has("ArrowDown")) return;

      const pRow = entitySupportRow(p) - 1;
      state.enemies = state.enemies.filter((e) => {
        if (e.state !== "trapped") return true;
        const eRow = entitySupportRow(e);
        const overlapsHorizontally = p.x < e.x + e.w && p.x + p.w > e.x;
        if (overlapsHorizontally && eRow === pRow + 1) {
          state.score += 200;
          return false;
        }
        return true;
      });
    }

    // プレイヤーと通常状態の敵が接触したか確認する。
    function checkPlayerHit() {
      const p = state.player;
      if (!p) return;
      for (const e of state.enemies) {
        if (e.state === "trapped") continue;
        const dx = Math.abs((p.x + p.w / 2) - (e.x + e.w / 2));
        const dy = Math.abs((p.y + p.h / 2) - (e.y + e.h / 2));
        if (dx < 4 && dy < 4) {
          loseLife();
          return;
        }
      }
    }

    // プレイ中のゲーム状態を1フレーム分更新する。
    function update(dt) {
      if (state.mode !== "PLAY") return;

      if (KEYS.has(" ")) digHole();
      updateHoles(dt);
      updatePlayer(dt);

      state.enemies.forEach((e) => updateEnemy(e, dt));
      resolveStomp();
      checkPlayerHit();

      if (state.enemies.length === 0) {
        state.mode = "CLEAR";
        setTimeout(nextStage, 900);
      }
    }

    // マップの床、梯子、穴をオフスクリーンバッファへ描画する。
    function drawMap() {
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          if (col % (TILE_W / CHIP_W) !== 0 || row % (TILE_H / CHIP_H) !== 0) continue;
          const chip = state.map[row][col];
          const x = col * CHIP_W;
          const y = row * CHIP_H;
          if (chip === MAP_FLOOR) drawSprite(SPRITES.wall, x, y);
          if (chip === MAP_LADDER) drawSprite(SPRITES.ladder, x, y);
        }
      }

      state.holes.forEach((h) => {
        ctx.fillStyle = h.phase === "closing" ? "#3a2e2e" : "#000";
        ctx.fillRect(h.col * CHIP_W, h.row * CHIP_H, h.width * CHIP_W, h.height * CHIP_H);
      });
    }

    // プレイヤーと敵キャラクターを描画する。
    function drawEntities() {
      const p = state.player;
      if (p) {
        const isMoving = p.moveDistanceRemaining > 0;
        if (isMoving && p.onLadder && Math.abs(p.vy) > 1) {
          const frame = getPlayerAnimationFrameIndex(p.climbAnim);
          drawSprite(SPRITES.playerClimb[frame], Math.round(p.x), Math.round(p.y));
        } else {
          const frame = isMoving && !p.onLadder
            ? getPlayerAnimationFrameIndex(p.anim)
            : 0;
          drawSprite(SPRITES.player[frame], Math.round(p.x), Math.round(p.y), p.facing > 0);
        }
      }

      state.enemies.forEach((e) => {
        const frame = e.state === "trapped" ? 0 : Math.floor(e.anim) % SPRITES.monster.length;
        drawSprite(SPRITES.monster[frame], Math.round(e.x), Math.round(e.y));
      });
    }

    // タイトル画面など、ゲーム画面の上に重ねる表示を描画する。
    function drawOverlay() {
      if (state.mode === "TITLE") {
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(0, 0, buffer.width, buffer.height);
        ctx.fillStyle = "#00c2ff";
        ctx.font = "6px 'Press Start 2P', monospace";
        ctx.fillText("SPACE PANIC", 34, 40);
        ctx.font = "4px 'Press Start 2P', monospace";
        ctx.fillText("PRESS ENTER", 44, 50);
      }
    }

    // スコア、残機、ステージ番号のHUD表示を更新する。
    function drawHUD() {
      const hudText = `SCORE ${state.score.toString().padStart(5, "0")}   LIVES ${state.lives}   STAGE ${state.stage}`;
      if (hudText !== lastHudText) {
        hud.textContent = hudText;
        lastHudText = hudText;
      }
    }

    // ゲーム画面全体を描画し、表示用キャンバスへ拡大転送する。
    function render() {
      ctx.clearRect(0, 0, buffer.width, buffer.height);
      drawMap();
      drawEntities();
      drawOverlay();
      drawHUD();

      screenCtx.clearRect(0, 0, canvas.width, canvas.height);
      screenCtx.drawImage(buffer, 0, 0, canvas.width, canvas.height);
    }

    // requestAnimationFrameで呼ばれるメインループ処理。
    function loop(ts) {
      if (!state.lastTime) state.lastTime = ts;
      const dt = Math.min(0.033, (ts - state.lastTime) / 1000);
      state.lastTime = ts;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    resetPlayer();
    spawnEnemies();
    requestAnimationFrame(loop);
  </script>
</body>

</html>
