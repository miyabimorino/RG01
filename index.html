<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>Space Panic - Browser Clone</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #121212;
      --accent: #00c2ff;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, #1a1a1a, #050505 60%, #000);
      color: #e5e5e5;
      font-family: "Press Start 2P", "MS Gothic", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      margin: 6px 0 0;
      letter-spacing: 2px;
      color: var(--accent);
    }

    canvas {
      border: 4px solid #2b2b2b;
      background: #000;
      image-rendering: pixelated;
      box-shadow: 0 0 20px rgba(0, 194, 255, 0.15);
      max-width: 100%;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #bfbfbf;
    }

    .inst {
      font-size: 10px;
      color: #9b9b9b;
      width: min(100%, 640px);
    }
  </style>
</head>

<body>
  <h1>SPACE PANIC - JS EDITION</h1>
  <div class="hud" id="hud"></div>
  <canvas id="gameCanvas" width="640" height="400"></canvas>
  <div class="inst" id="inst">移動: ←→ / 梯子: ↑↓ / 掘る: Space / 踏みつけ: ↓</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const screenCtx = canvas.getContext("2d");
    screenCtx.imageSmoothingEnabled = false;
    const hud = document.getElementById("hud");
    const inst = document.getElementById("inst");

    const LOGICAL_WIDTH = 160;
    const LOGICAL_HEIGHT = 100;
    const buffer = document.createElement("canvas");
    buffer.width = LOGICAL_WIDTH;
    buffer.height = LOGICAL_HEIGHT;
    const ctx = buffer.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    function resizeCanvas() {
      const bodyStyle = window.getComputedStyle(document.body);
      const horizontalPadding = (parseFloat(bodyStyle.paddingLeft) || 0) + (parseFloat(bodyStyle.paddingRight) || 0);
      const verticalPadding = (parseFloat(bodyStyle.paddingTop) || 0) + (parseFloat(bodyStyle.paddingBottom) || 0);
      const borderSize = 8;
      const gapTotal = 30;

      const availableWidth = Math.max(1, window.innerWidth - horizontalPadding - borderSize);
      const occupiedHeight = document.querySelector("h1").offsetHeight + hud.offsetHeight + inst.offsetHeight;
      const availableHeight = Math.max(1, window.innerHeight - verticalPadding - occupiedHeight - gapTotal - borderSize);
      const scale = Math.max(1, Math.min(availableWidth / LOGICAL_WIDTH, availableHeight / LOGICAL_HEIGHT));

      const cssWidth = Math.floor(LOGICAL_WIDTH * scale);
      const cssHeight = Math.floor(LOGICAL_HEIGHT * scale);
      const dpr = window.devicePixelRatio || 1;

      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;
      canvas.width = Math.max(1, Math.floor(cssWidth * dpr));
      canvas.height = Math.max(1, Math.floor(cssHeight * dpr));
      screenCtx.imageSmoothingEnabled = false;
      hud.style.width = `${cssWidth}px`;
      inst.style.width = `${cssWidth}px`;
    }

    const TILE = 8;
    const CHIP_W = 8;
    const CHIP_H = 4;
    const COLS = 20;
    const ROWS = 25;
    const MAP_EMPTY = 0;
    const MAP_FLOOR = 1;
    const MAP_LADDER = 2;
    const FLOOR_ROWS = [4, 9, 14, 19, 24];
    const LADDER_GROUPS = [
      { startRow: 3, endRow: 8, count: 3 },
      { startRow: 8, endRow: 13, count: 2 },
      { startRow: 13, endRow: 18, count: 1 },
      { startRow: 18, endRow: 23, count: 6 },
    ];

    const CONFIG = {
      gravity: 70,
      moveSpeed: 18,
      climbSpeed: 16,
      digDuration: 0.35,
      holeOpenTime: 4.0,
      holeCloseTime: 1.0,
      enemySpeed: 12,
      enemyTrapTime: 3.5,
    };

    const SPRITES = {
      wall: [
        { x: 0, y: 0, colorCode: 4 }, { x: 1, y: 0, colorCode: 4 }, { x: 2, y: 0, colorCode: 4 }, { x: 4, y: 0, colorCode: 4 }, { x: 5, y: 0, colorCode: 4 }, { x: 6, y: 0, colorCode: 4 },
        { x: 0, y: 1, colorCode: 4 }, { x: 1, y: 1, colorCode: 4 }, { x: 2, y: 1, colorCode: 4 }, { x: 4, y: 1, colorCode: 4 }, { x: 5, y: 1, colorCode: 4 }, { x: 6, y: 1, colorCode: 4 },
        { x: 0, y: 3, colorCode: 4 }, { x: 2, y: 3, colorCode: 4 }, { x: 3, y: 3, colorCode: 4 }, { x: 4, y: 3, colorCode: 4 }, { x: 6, y: 3, colorCode: 4 }, { x: 7, y: 3, colorCode: 4 },

          { x: 2, y: 2, colorCode: 2 }, { x: 3, y: 2, colorCode: 2 }, { x: 4, y: 2, colorCode: 2 }, { x: 5, y: 2, colorCode: 2 },

          { x: 3, y: 3, colorCode: 6 }, { x: 4, y: 3, colorCode: 6 }, { x: 5, y: 3, colorCode: 6 },

          { x: 3, y: 5, colorCode: 1 }, { x: 4, y: 5, colorCode: 1 }, { x: 5, y: 5, colorCode: 2 }, { x: 6, y: 5, colorCode: 6 },
          { x: 3, y: 6, colorCode: 1 }, { x: 4, y: 6, colorCode: 1 }, { x: 5, y: 6, colorCode: 1 },

          { x: 3, y: 8, colorCode: 1 }, { x: 4, y: 8, colorCode: 1 }, { x: 5, y: 8, colorCode: 1 },

          { x: 2, y: 11, colorCode: 2 }, { x: 3, y: 11, colorCode: 2 },
        ],
      ],
      playerClimb: [
        [
          { x: 3, y: 1, colorCode: 2 }, { x: 4, y: 1, colorCode: 2 }, { x: 5, y: 1, colorCode: 2 },
          { x: 2, y: 2, colorCode: 2 }, { x: 3, y: 2, colorCode: 2 }, { x: 4, y: 2, colorCode: 2 }, { x: 5, y: 2, colorCode: 2 },
          { x: 3, y: 3, colorCode: 6 }, { x: 4, y: 3, colorCode: 6 }, { x: 5, y: 3, colorCode: 6 },
          { x: 4, y: 4, colorCode: 6 },
          { x: 2, y: 5, colorCode: 6 }, { x: 3, y: 5, colorCode: 2 }, { x: 4, y: 5, colorCode: 1 }, { x: 5, y: 5, colorCode: 2 }, { x: 6, y: 5, colorCode: 6 },
          { x: 3, y: 6, colorCode: 1 }, { x: 4, y: 6, colorCode: 1 }, { x: 5, y: 6, colorCode: 1 },
          { x: 3, y: 7, colorCode: 1 }, { x: 4, y: 7, colorCode: 1 }, { x: 5, y: 7, colorCode: 1 },
          { x: 2, y: 8, colorCode: 6 }, { x: 3, y: 8, colorCode: 2 }, { x: 4, y: 8, colorCode: 1 }, { x: 5, y: 8, colorCode: 2 }, { x: 6, y: 8, colorCode: 6 },
          { x: 3, y: 9, colorCode: 1 }, { x: 4, y: 9, colorCode: 1 }, { x: 5, y: 9, colorCode: 1 },
          { x: 3, y: 10, colorCode: 2 }, { x: 5, y: 10, colorCode: 2 },
          { x: 2, y: 11, colorCode: 2 }, { x: 5, y: 11, colorCode: 2 },
        ],
        [
          { x: 3, y: 1, colorCode: 2 }, { x: 4, y: 1, colorCode: 2 }, { x: 5, y: 1, colorCode: 2 },
          { x: 2, y: 2, colorCode: 2 }, { x: 3, y: 2, colorCode: 2 }, { x: 4, y: 2, colorCode: 2 }, { x: 5, y: 2, colorCode: 2 },
          { x: 3, y: 3, colorCode: 6 }, { x: 4, y: 3, colorCode: 6 }, { x: 5, y: 3, colorCode: 6 },
          { x: 4, y: 4, colorCode: 6 },
          { x: 2, y: 5, colorCode: 6 }, { x: 3, y: 5, colorCode: 2 }, { x: 4, y: 5, colorCode: 1 }, { x: 5, y: 5, colorCode: 2 }, { x: 6, y: 5, colorCode: 6 },
          { x: 3, y: 6, colorCode: 1 }, { x: 4, y: 6, colorCode: 1 }, { x: 5, y: 6, colorCode: 1 },
          { x: 3, y: 7, colorCode: 1 }, { x: 4, y: 7, colorCode: 1 }, { x: 5, y: 7, colorCode: 1 },
          { x: 2, y: 8, colorCode: 6 }, { x: 3, y: 8, colorCode: 2 }, { x: 4, y: 8, colorCode: 1 }, { x: 5, y: 8, colorCode: 2 }, { x: 6, y: 8, colorCode: 6 },
          { x: 3, y: 9, colorCode: 1 }, { x: 4, y: 9, colorCode: 1 }, { x: 5, y: 9, colorCode: 1 },
          { x: 2, y: 10, colorCode: 2 }, { x: 4, y: 10, colorCode: 2 },
          { x: 2, y: 11, colorCode: 2 }, { x: 4, y: 11, colorCode: 2 },
        ],
        [
          { x: 3, y: 1, colorCode: 2 }, { x: 4, y: 1, colorCode: 2 }, { x: 5, y: 1, colorCode: 2 },
          { x: 2, y: 2, colorCode: 2 }, { x: 3, y: 2, colorCode: 2 }, { x: 4, y: 2, colorCode: 2 }, { x: 5, y: 2, colorCode: 2 },
          { x: 3, y: 3, colorCode: 6 }, { x: 4, y: 3, colorCode: 6 }, { x: 5, y: 3, colorCode: 6 },
          { x: 4, y: 4, colorCode: 6 },
          { x: 2, y: 5, colorCode: 6 }, { x: 3, y: 5, colorCode: 2 }, { x: 4, y: 5, colorCode: 1 }, { x: 5, y: 5, colorCode: 2 }, { x: 6, y: 5, colorCode: 6 },
          { x: 3, y: 6, colorCode: 1 }, { x: 4, y: 6, colorCode: 1 }, { x: 5, y: 6, colorCode: 1 },
          { x: 2, y: 7, colorCode: 6 }, { x: 3, y: 7, colorCode: 2 }, { x: 4, y: 7, colorCode: 1 }, { x: 5, y: 7, colorCode: 2 }, { x: 6, y: 7, colorCode: 6 },
          { x: 3, y: 8, colorCode: 1 }, { x: 4, y: 8, colorCode: 1 }, { x: 5, y: 8, colorCode: 1 },
          { x: 3, y: 9, colorCode: 1 }, { x: 4, y: 9, colorCode: 1 }, { x: 5, y: 9, colorCode: 1 },
          { x: 3, y: 10, colorCode: 2 }, { x: 5, y: 10, colorCode: 2 },
          { x: 3, y: 11, colorCode: 2 }, { x: 5, y: 11, colorCode: 2 },
        ],
      ],
    };

    function drawSprite(sprite, x, y, flipX = false) {
      const spriteWidth = sprite.reduce((max, cell) => Math.max(max, cell.x), 0) + 1;
      for (const cell of sprite) {
        const dx = flipX ? spriteWidth - 1 - cell.x : cell.x;
        ctx.fillStyle = getColor(cell.colorCode);
        ctx.fillRect(x + dx, y + cell.y, 1, 1);
      }
    }

    function randomLadderChipColumn() {
      const x = Math.floor(Math.random() * 7) * 16 + 16;
      return Math.floor(x / CHIP_W);
    }

    const KEYS = new Set();
    window.addEventListener("keydown", (e) => {
      KEYS.add(e.key);
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === "Enter" && state.mode === "TITLE") {
        startGame();
      }
    });
    window.addEventListener("keyup", (e) => KEYS.delete(e.key));

    function makeStageMap() {
      const map = Array.from({ length: ROWS }, () => Array(COLS).fill(MAP_EMPTY));

      FLOOR_ROWS.forEach((row) => {
        for (let col = 0; col < COLS; col++) {
          map[row][col] = MAP_FLOOR;
        }
      });

      LADDER_GROUPS.forEach((group) => {
        const usedCols = new Set();
        while (usedCols.size < group.count) {
          usedCols.add(randomLadderChipColumn());
        }
        usedCols.forEach((col) => {
          const ladderTopRow = Math.max(group.startRow - 1, 0);
          for (let row = ladderTopRow; row <= group.endRow; row++) {
            map[row][col] = MAP_LADDER;
          }
        });
      });

      return map;
    }

    const initialMap = makeStageMap();

    const state = {
      mode: "TITLE",
      score: 0,
      lives: 3,
      stage: 1,
      map: initialMap,
      holes: [],
      player: null,
      enemies: [],
      lastTime: 0,
    };

    function resetPlayer() {
      state.player = {
        x: 1 * TILE,
        y: 84,
        w: 8,
        h: 12,
        vx: 0,
        vy: 0,
        facing: 1,
        onLadder: false,
        supportLockRow: null,
        digging: 0,
        anim: 0,
        climbAnim: 0,
        moveFlags: {
          left: false,
          right: false,
          up: false,
          down: false,
        },
      };
    }

    function spawnEnemies() {
      const base = [
        { x: 64, y: 8 },
        { x: 72, y: 28 },
        { x: 96, y: 48 },
      ];
      state.enemies = base.map((p) => ({
        x: p.x,
        y: p.y,
        w: 8,
        h: 8,
        vx: 0,
        vy: 0,
        state: "walk",
        trappedTimer: 0,
      }));
    }

    function startGame() {
      const stageMap = makeStageMap();
      state.mode = "PLAY";
      state.score = 0;
      state.lives = 3;
      state.stage = 1;
      state.map = stageMap;
      state.holes = [];
      resetPlayer();
      spawnEnemies();
    }

    function nextStage() {
      const stageMap = makeStageMap();
      state.stage += 1;
      state.map = stageMap;
      state.holes = [];
      resetPlayer();
      spawnEnemies();
      state.mode = "PLAY";
    }

    function loseLife() {
      state.lives -= 1;
      if (state.lives <= 0) {
        state.mode = "TITLE";
        state.player = null;
        state.enemies = [];
        state.holes = [];
      } else {
        resetPlayer();
      }
    }

    function mapValueAt(col, row) {
      if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return MAP_EMPTY;
      return state.map[row][col];
    }

    function pixelToMap(x, y) {
      return {
        col: Math.floor(x / CHIP_W),
        row: Math.floor(y / CHIP_H),
      };
    }

    function holeAt(col, row) {
      return state.holes.find((h) => h.col === col && h.row === row);
    }

    function hasFloorAtCell(col, row) {
      if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
      return mapValueAt(col, row) === MAP_FLOOR;
    }

    function hasLadderAtCell(col, row) {
      if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
      return mapValueAt(col, row) === MAP_LADDER;
    }

    function floorBlockedByHole(col, row) {
      const hole = holeAt(col, row);
      if (!hole) return false;
      if (hole.phase === "open") return true;
      if (hole.phase === "closing" && hole.timer >= 0.2) return true;
      return false;
    }

    function floorAtPixel(x, y) {
      if (x < 0 || x >= LOGICAL_WIDTH || y < 0 || y >= LOGICAL_HEIGHT) return false;
      const { col, row } = pixelToMap(x, y);
      if (!hasFloorAtCell(col, row)) return false;
      if (floorBlockedByHole(col, row)) return false;
      return true;
    }

    function ladderAtPixel(x, y) {
      if (x < 0 || x >= LOGICAL_WIDTH || y < 0 || y >= LOGICAL_HEIGHT) return false;
      const { col, row } = pixelToMap(x, y);
      return hasLadderAtCell(col, row);
    }

    function isAlignedToGrid(value, size) {
      return Math.abs(value - Math.round(value / size) * size) < 0.001;
    }

    function snapToGrid(value, size) {
      return Math.round(value / size) * size;
    }

    function entityColumn(entity) {
      return Math.round(entity.x / CHIP_W);
    }

    function entityTopRow(entity) {
      return Math.floor(entity.y / CHIP_H);
    }

    function entityBottomRow(entity) {
      return Math.floor((entity.y + entity.h - 1) / CHIP_H);
    }

    function entitySupportRow(entity) {
      return Math.floor((entity.y + entity.h) / CHIP_H);
    }

    function entityTouchesLadder(entity) {
      const col = entityColumn(entity);
      const topRow = entityTopRow(entity);
      const bottomRow = entityBottomRow(entity);
      for (let row = topRow; row <= bottomRow; row++) {
        if (hasLadderAtCell(col, row)) return true;
      }
      return false;
    }

    function ladderAboveEntity(entity) {
      return hasLadderAtCell(entityColumn(entity), entityTopRow(entity) - 1);
    }

    function ladderBelowEntity(entity) {
      return hasLadderAtCell(entityColumn(entity), entitySupportRow(entity));
    }

    function ladderAligned(entity) {
      return isAlignedToGrid(entity.x, CHIP_W);
    }

    function verticalAligned(entity) {
      return isAlignedToGrid(entity.y, CHIP_H);
    }

    function atDecisionPoint(entity) {
      return ladderAligned(entity) && verticalAligned(entity);
    }

    function findSupportY(entity, maxDistance = 3) {
      const leftX = Math.floor(entity.x + 1);
      const rightX = Math.floor(entity.x + entity.w - 2);
      const footBase = Math.floor(entity.y + entity.h);
      for (let dy = 0; dy <= maxDistance; dy++) {
        const sampleY = footBase + dy;
        if (floorAtPixel(leftX, sampleY) || floorAtPixel(rightX, sampleY)) {
          return sampleY;
        }
      }
      return null;
    }

    function feetOnFloor(entity) {
      return findSupportY(entity) !== null;
    }

    function footOnFloorMap(entity) {
      const leftX = Math.floor(entity.x + 1);
      const rightX = Math.floor(entity.x + entity.w - 2);
      const footY = Math.floor(entity.y + entity.h);
      return floorAtPixel(leftX, footY) || floorAtPixel(rightX, footY);
    }

    function snapToFloor(entity) {
      const supportY = findSupportY(entity);
      if (supportY === null) return;
      entity.y = supportY - entity.h;
      entity.vy = 0;
    }

    function canStandOnCell(col, row) {
      return hasFloorAtCell(col, row) && !floorBlockedByHole(col, row);
    }

    function canMoveHorizontallyIntoCell(col, row) {
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return false;
      if (canStandOnCell(col, row)) return true;
      return hasLadderAtCell(col, row);
    }

    function hasSideFloor(col, row) {
      return canStandOnCell(col - 1, row) || canStandOnCell(col + 1, row);
    }

    function canStayOnSupportRow(entity, row) {
      const col = entityColumn(entity);
      if (row < 0 || row >= ROWS) return false;
      return canStandOnCell(col, row) || hasLadderAtCell(col, row);
    }

    function refreshPlayerMoveFlags(player) {
      if (!atDecisionPoint(player)) return;

      const col = entityColumn(player);
      const supportRow = entitySupportRow(player);
      const ladderAbove = ladderAboveEntity(player);
      const ladderBelow = ladderBelowEntity(player);
      const standing = canStandOnCell(col, supportRow);
      const supportLocked = player.supportLockRow === supportRow;
      const canStepSideways = standing || supportLocked || player.onLadder;

      player.moveFlags.left = col > 0 && canStepSideways && canMoveHorizontallyIntoCell(col - 1, supportRow);
      player.moveFlags.right = col < COLS - 1 && canStepSideways && canMoveHorizontallyIntoCell(col + 1, supportRow);
      player.moveFlags.up = ladderAbove;
      player.moveFlags.down = ladderBelow;
    }

    function moveToNextBoundary(position, delta, size) {
      if (delta === 0) return position;
      const nextPosition = position + delta;
      if (delta > 0) {
        const nextBoundary = Math.ceil((position + 0.001) / size) * size;
        if (!isAlignedToGrid(position, size) && nextPosition > nextBoundary) {
          return nextBoundary;
        }
      } else {
        const nextBoundary = Math.floor((position - 0.001) / size) * size;
        if (!isAlignedToGrid(position, size) && nextPosition < nextBoundary) {
          return nextBoundary;
        }
      }
      return nextPosition;
    }

    function digHole() {
      const p = state.player;
      if (!p) return;
      if (p.digging > 0) return;
      const dir = p.facing;
      const col = entityColumn(p) + dir;
      const row = entitySupportRow(p);
      if (!hasFloorAtCell(col, row)) return;
      if (holeAt(col, row)) return;

      p.digging = CONFIG.digDuration;
      state.holes.push({ col, row, timer: CONFIG.holeOpenTime, phase: "open" });
    }

    function updateHoles(dt) {
      state.holes.forEach((h) => {
        if (h.phase === "open") {
          h.timer -= dt;
          if (h.timer <= 0) {
            h.phase = "closing";
            h.timer = CONFIG.holeCloseTime;
          }
        } else if (h.phase === "closing") {
          h.timer -= dt;
        }
      });
      state.holes = state.holes.filter((h) => h.phase !== "closing" || h.timer > 0);
    }

    function applyMovement(entity, dt, speedX, speedY) {
      entity.x += speedX * dt;
      entity.y += speedY * dt;
    }

    function keepInBounds(entity) {
      entity.x = Math.max(0, Math.min(entity.x, LOGICAL_WIDTH - entity.w));
      entity.y = Math.max(0, Math.min(entity.y, LOGICAL_HEIGHT - entity.h));
    }

    function canExitLadder(entity, direction) {
      const targetCol = entityColumn(entity) + direction;
      const supportRow = entitySupportRow(entity);
      if (targetCol < 0 || targetCol >= COLS) return false;
      return hasFloorAtCell(targetCol, supportRow) && !floorBlockedByHole(targetCol, supportRow);
    }

    function lockToSupportRow(entity, row) {
      entity.supportLockRow = row;
      entity.y = row * CHIP_H - entity.h;
      entity.vy = 0;
    }

    function updatePlayer(dt) {
      const p = state.player;
      if (!p) return;

      if (p.digging > 0) {
        p.digging -= dt;
        if (p.digging < 0) p.digging = 0;
      }

      const left = KEYS.has("ArrowLeft");
      const right = KEYS.has("ArrowRight");
      const up = KEYS.has("ArrowUp");
      const down = KEYS.has("ArrowDown");

      if (left) p.facing = -1;
      if (right) p.facing = 1;

      if (!p.onLadder && p.vy >= 0 && feetOnFloor(p)) {
        snapToFloor(p);
      }

      if (atDecisionPoint(p)) {
        p.x = snapToGrid(p.x, CHIP_W);
        p.y = snapToGrid(p.y, CHIP_H);
        refreshPlayerMoveFlags(p);

        p.vx = 0;
        p.vy = 0;

        if (p.digging === 0) {
          const currentCol = entityColumn(p);
          const currentSupportRow = entitySupportRow(p);
          const ladderHere = entityTouchesLadder(p);
          const ladderAbove = ladderAboveEntity(p);
          const exitSupportRow = currentSupportRow - 1;
          const canStepOffLadderAtTop = p.onLadder
            && up
            && !down
            && ladderHere
            && !ladderAbove
            && hasSideFloor(currentCol, exitSupportRow);

          if (canStepOffLadderAtTop) {
            p.onLadder = false;
            lockToSupportRow(p, exitSupportRow);
          } else if (up && !down && p.moveFlags.up) {
            p.onLadder = true;
            p.supportLockRow = null;
            p.vy = -CONFIG.climbSpeed;
          } else if (down && !up && p.moveFlags.down) {
            p.onLadder = true;
            p.supportLockRow = null;
            p.vy = CONFIG.climbSpeed;
          } else if (left && !right && p.moveFlags.left) {
            p.onLadder = false;
            lockToSupportRow(p, entitySupportRow(p));
            p.vx = -CONFIG.moveSpeed;
          } else if (right && !left && p.moveFlags.right) {
            p.onLadder = false;
            lockToSupportRow(p, entitySupportRow(p));
            p.vx = CONFIG.moveSpeed;
          } else {
            const ladderStillUsable = entityTouchesLadder(p) || ladderAboveEntity(p) || ladderBelowEntity(p);
            p.onLadder = p.onLadder && ladderStillUsable;
            if (!p.onLadder && feetOnFloor(p)) {
              p.supportLockRow = entitySupportRow(p);
            }
          }
        } else {
          p.onLadder = false;
          p.supportLockRow = null;
        }
      }

      if (p.onLadder) {
        p.x = snapToGrid(p.x, CHIP_W);
        p.supportLockRow = null;
      } else if (p.supportLockRow !== null) {
        p.y = p.supportLockRow * CHIP_H - p.h;
        p.vy = 0;
      } else if (feetOnFloor(p)) {
        snapToFloor(p);
        p.supportLockRow = entitySupportRow(p);
        p.vy = 0;
      } else {
        p.vx = 0;
        p.vy += CONFIG.gravity * dt;
      }

      p.x = moveToNextBoundary(p.x, p.vx * dt, CHIP_W);
      p.y = moveToNextBoundary(p.y, p.vy * dt, CHIP_H);

      if (!p.onLadder && p.vy >= 0 && feetOnFloor(p)) {
        snapToFloor(p);
        p.supportLockRow = entitySupportRow(p);
      }

      if (atDecisionPoint(p)) {
        p.x = snapToGrid(p.x, CHIP_W);
        p.y = snapToGrid(p.y, CHIP_H);
        const ladderStillUsable = entityTouchesLadder(p) || ladderAboveEntity(p) || ladderBelowEntity(p);
        if (p.onLadder && !ladderStillUsable) {
          p.onLadder = false;
          p.vy = 0;
        }
        if (!p.onLadder) {
          if (footOnFloorMap(p)) {
            p.supportLockRow = entitySupportRow(p);
          } else if (p.supportLockRow !== null && canStayOnSupportRow(p, p.supportLockRow)) {
            p.y = p.supportLockRow * CHIP_H - p.h;
            p.vy = 0;
          } else {
            p.supportLockRow = null;
          }
        }
        refreshPlayerMoveFlags(p);
      }

      if (p.onLadder && Math.abs(p.vy) > 1) {
        p.climbAnim += dt * 8;
      } else {
        p.climbAnim = 0;
      }

      if (Math.abs(p.vx) > 1 && !p.onLadder) {
        p.anim += dt * 8;
      } else {
        p.anim = 0;
      }

      keepInBounds(p);
    }

    function enemyAI(enemy, dt) {
      if (!state.player) {
        enemy.vx = 0;
        enemy.vy = 0;
        return;
      }
      if (enemy.state === "trapped") return;

      const p = state.player;
      const ex = enemy.x + enemy.w / 2;
      const ey = enemy.y + enemy.h / 2;
      const px = p.x + p.w / 2;
      const py = p.y + p.h / 2;

      const sameRow = Math.floor(ey / TILE) === Math.floor(py / TILE);
      const ladderHere = entityTouchesLadder(enemy);

      if (ladderHere && !sameRow) {
        enemy.vy = py > ey ? CONFIG.climbSpeed * 0.85 : -CONFIG.climbSpeed * 0.85;
        enemy.vx = 0;
      } else {
        enemy.vx = px > ex ? CONFIG.enemySpeed : -CONFIG.enemySpeed;
        enemy.vy += CONFIG.gravity * dt;
      }
    }

    function updateEnemy(enemy, dt) {
      if (enemy.state === "trapped") {
        enemy.trappedTimer -= dt;
        enemy.vx = 0;
        enemy.vy = 0;
        if (enemy.trappedTimer <= 0) {
          enemy.state = "walk";
        }
        return;
      }

      enemyAI(enemy, dt);
      applyMovement(enemy, dt, enemy.vx, enemy.vy);

      if (enemy.vy >= 0 && feetOnFloor(enemy)) {
        snapToFloor(enemy);
      }

      const footRow = Math.floor((enemy.y + enemy.h) / CHIP_H);
      const footCol = Math.floor((enemy.x + enemy.w / 2) / CHIP_W);
      const hole = holeAt(footCol, footRow);
      if (hole && hole.phase === "open" && enemy.vy >= 0) {
        enemy.state = "trapped";
        enemy.trappedTimer = CONFIG.enemyTrapTime;
        enemy.y = footRow * CHIP_H - enemy.h + 1;
        enemy.vy = 0;
      }

      keepInBounds(enemy);
    }

    function resolveStomp() {
      const p = state.player;
      if (!p) return;
      if (!KEYS.has("ArrowDown")) return;

      const pCol = Math.floor((p.x + p.w / 2) / CHIP_W);
      const pRow = Math.floor((p.y + p.h) / CHIP_H) - 1;
      state.enemies = state.enemies.filter((e) => {
        if (e.state !== "trapped") return true;
        const eCol = Math.floor((e.x + e.w / 2) / CHIP_W);
        const eRow = Math.floor((e.y + e.h) / CHIP_H);
        if (eCol === pCol && eRow === pRow + 1) {
          state.score += 200;
          return false;
        }
        return true;
      });
    }

    function checkPlayerHit() {
      const p = state.player;
      if (!p) return;
      for (const e of state.enemies) {
        if (e.state === "trapped") continue;
        const dx = Math.abs((p.x + p.w / 2) - (e.x + e.w / 2));
        const dy = Math.abs((p.y + p.h / 2) - (e.y + e.h / 2));
        if (dx < 4 && dy < 4) {
          loseLife();
          return;
        }
      }
    }

    function update(dt) {
      if (state.mode !== "PLAY") return;

      if (KEYS.has(" ")) digHole();
      updateHoles(dt);
      updatePlayer(dt);

      state.enemies.forEach((e) => updateEnemy(e, dt));
      resolveStomp();
      checkPlayerHit();

      if (state.enemies.length === 0) {
        state.mode = "CLEAR";
        setTimeout(nextStage, 900);
      }
    }

    function drawMap() {
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const chip = mapValueAt(col, row);
          const x = col * CHIP_W;
          const y = row * CHIP_H;
          if (chip === MAP_FLOOR) drawSprite(SPRITES.wall, x, y);
          if (chip === MAP_LADDER) drawSprite(SPRITES.ladder, x, y);
        }
      }

      state.holes.forEach((h) => {
        ctx.fillStyle = h.phase === "closing" ? "#3a2e2e" : "#000";
        ctx.fillRect(h.col * CHIP_W, h.row * CHIP_H, CHIP_W, CHIP_H);
      });
    }

    function drawEntities() {
      const p = state.player;
      if (p) {
        if (p.onLadder && Math.abs(p.vy) > 1) {
          const frame = Math.floor(p.climbAnim) % SPRITES.playerClimb.length;
          drawSprite(SPRITES.playerClimb[frame], Math.round(p.x), Math.round(p.y));
        } else {
          const frame = p.anim === 0 ? 0 : Math.floor(p.anim) % SPRITES.player.length;
          drawSprite(SPRITES.player[frame], Math.round(p.x), Math.round(p.y), p.facing > 0);
        }
      }

      state.enemies.forEach((e) => {
        ctx.fillStyle = e.state === "trapped" ? "#d94bff" : "#ff375f";
        ctx.fillRect(e.x + 1, e.y + 1, e.w - 2, e.h - 2);
      });
    }

    function drawOverlay() {
      if (state.mode === "TITLE") {
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(0, 0, buffer.width, buffer.height);
        ctx.fillStyle = "#00c2ff";
        ctx.font = "6px 'Press Start 2P', monospace";
        ctx.fillText("SPACE PANIC", 34, 40);
        ctx.font = "4px 'Press Start 2P', monospace";
        ctx.fillText("PRESS ENTER", 44, 50);
      }
    }

    function drawHUD() {
      hud.textContent = `SCORE ${state.score.toString().padStart(5, "0")}   LIVES ${state.lives}   STAGE ${state.stage}`;
    }

    function render() {
      ctx.clearRect(0, 0, buffer.width, buffer.height);
      drawMap();
      drawEntities();
      drawOverlay();
      drawHUD();

      screenCtx.clearRect(0, 0, canvas.width, canvas.height);
      screenCtx.drawImage(buffer, 0, 0, canvas.width, canvas.height);
    }

    function loop(ts) {
      if (!state.lastTime) state.lastTime = ts;
      const dt = Math.min(0.033, (ts - state.lastTime) / 1000);
      state.lastTime = ts;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    function getColor(colorCode) {
      switch (colorCode) {
        case 0: return "black";
        case 1: return "blue";
        case 2: return "red";
        case 3: return "purple";
        case 4: return "lime";
        case 5: return "aqua";
        case 6: return "yellow";
        case 7: return "white";
        default: return "black";
      }
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    resetPlayer();
    spawnEnemies();
    requestAnimationFrame(loop);
  </script>
</body>

</html>
